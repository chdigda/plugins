name: Plugin validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: node --check client-bundle.mjs
      - run: node --check packages/dsh-web-search/client-bundle.mjs
      - run: node --check packages/dsh-session-delete/client.mjs
      - run: npm test
